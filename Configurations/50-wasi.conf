## -*- mode: perl; -*-

my %targets = (
    "wasi-common" => {
        template         => 1,
        inherit_from     => [ "gcc" ],
        AR               => "llvm-ar",
        RANLIB           => "llvm-ranlib",
        exe_extension    => ".wasm",
        disable          => [ "asm", "shared", "dso", "threads", "async",
                              "secure-memory", "ui-console", "dgram",
                              "ktls" ],
        defines          => add("OPENSSL_NO_UNIX_SOCK", "OPENSSL_AES_CONST_TIME"),
        cppflags         => add("-D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS"),
        ex_libs          => add("-lwasi-emulated-signal -lwasi-emulated-process-clocks"),
    },
    "wasm32-wasip1" => {
        inherit_from     => [ "wasi-common" ],
        CC               => "wasm32-wasip1-clang",
        disable          => add("sock"),
    },
    "wasm32-wasip2" => {
        inherit_from     => [ "wasi-common" ],
        CC               => "wasm32-wasip2-clang",
    },
    "wasm32-wasip3" => {
        inherit_from     => [ "wasi-common" ],
        CC               => "wasm32-wasip3-clang",
    },
);
